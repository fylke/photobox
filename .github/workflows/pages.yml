name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'installer/src/**'
      - 'installer/package.json'
      - 'installer/vite.config.ts'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build installer
        run: |
          cd installer
          npm install
          
          # Generate index.html template for Vite
          echo '<!doctype html>' > index.html
          echo '<html lang="en">' >> index.html
          echo '  <head>' >> index.html
          echo '    <meta charset="UTF-8" />' >> index.html
          echo '    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>" />' >> index.html
          echo '    <meta name="viewport" content="width=device-width, initial-scale=1.0" />' >> index.html
          echo '    <title>Photobox Installer</title>' >> index.html
          echo '  </head>' >> index.html
          echo '  <body>' >> index.html
          echo '    <div id="root"></div>' >> index.html
          echo '    <script type="module" src="./src/main.tsx"></script>' >> index.html
          echo '  </body>' >> index.html
          echo '</html>' >> index.html
          
          npm run build

      - name: Copy built assets to docs
        run: |
          mkdir -p docs/installer
          cp -r installer/dist/* docs/installer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
