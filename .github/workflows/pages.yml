name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'installer/index.html'
      - 'installer/src/**'
      - 'installer/tests/**'
      - 'installer/package.json'
      - 'installer/package-lock.json'
      - 'installer/vite.config.ts'
      - 'tools/stage_installer_image.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: photobox-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build installer
        working-directory: installer
        run: |
          npm ci
          npm test
          npm run build

      - name: Copy built assets to docs
        run: |
          mkdir -p docs/installer
          cp -r installer/dist/* docs/installer/

      - name: Stage latest prerelease image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
            | jq -r '[.[][] | select(.prerelease and (.draft | not))] | sort_by(.published_at) | last | .tag_name // empty')"
          if [ -z "$tag" ]; then
            echo "No published prerelease is available; no image will be staged."
            exit 0
          fi
          mkdir -p release-image
          gh release download "$tag" --dir release-image --pattern '*.img.xz' --pattern SHA256SUMS
          has_capabilities="$(gh release view "$tag" --json assets --jq 'any(.assets[]; .name == "photobox-image-capabilities.json")')"
          if [ "$has_capabilities" = true ]; then
            gh release download "$tag" --dir release-image --pattern photobox-image-capabilities.json
          fi
          python3 tools/stage_installer_image.py release-image docs/installer/image
          mapfile -t images < <(find release-image -maxdepth 1 -name '*.img.xz' -print)
          python3 tools/build_imager_catalog.py "${images[0]}" "$GH_REPO" "$tag" docs/imager.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
