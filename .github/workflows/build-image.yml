name: Build Raspberry Pi image

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-image.yml"
      - "image/**"
      - "pyproject.toml"
      - "src/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Photobox wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Build standalone provisioning tool
        run: |
          python -m pip install --no-deps --target dist/provisioner-deps 'qrcode>=8,<9'
          python tools/build_provisioner.py \
            --qrcode-package dist/provisioner-deps/qrcode \
            --output dist/photobox-provision.pyz

      - uses: actions/checkout@v4
        with:
          repository: RPi-Distro/pi-gen
          ref: c851f00178c64b87a86c06c2be216bd89d62e55b
          path: pi-gen

      - name: Prepare minimal image build
        run: |
          mkdir -p pi-gen/photobox/00-photobox/files
          cp image/photobox-stage/EXPORT_IMAGE pi-gen/photobox/EXPORT_IMAGE
          cp image/photobox-stage/prerun.sh pi-gen/photobox/prerun.sh
          chmod +x pi-gen/photobox/prerun.sh
          cp image/photobox-stage/00-photobox/00-packages-nr \
            image/photobox-stage/00-photobox/00-run-chroot.sh \
            pi-gen/photobox/00-photobox/
          cp image/photobox-stage/00-photobox/00-run.sh \
            pi-gen/photobox/00-photobox/00-run.sh
          chmod +x pi-gen/photobox/00-photobox/00-run.sh
          cp image/photobox-stage/00-photobox/files/photobox.service \
            image/photobox-stage/00-photobox/files/photobox-first-boot.service \
            image/photobox-stage/00-photobox/files/photobox-regulatory-domain.service \
            image/photobox-stage/00-photobox/files/50-photobox-network.rules \
            pi-gen/photobox/00-photobox/files/
          cp dist/photobox-*.whl pi-gen/photobox/00-photobox/files/
          cat > pi-gen/photobox-config <<'EOF'
          IMG_NAME='photobox'
          TARGET_HOSTNAME='photobox'
          RELEASE='trixie'
          ARCH='arm64'
          STAGE_LIST='stage0 stage1 photobox'
          DEPLOY_COMPRESSION='xz'
          ENABLE_SSH=0
          ENABLE_CLOUD_INIT=0
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            arch-test bc bmap-tools coreutils curl debootstrap dosfstools \
            e2fsprogs file gpg grep kmod libcap2-bin parted pigz quilt \
            qemu-user-binfmt rsync xxd xz-utils zerofree zip

      - name: Build minimal generic Raspberry Pi OS image
        working-directory: pi-gen
        run: sudo ./build.sh -c photobox-config

      - name: Verify and checksum generic image
        run: |
          set -euo pipefail
          mapfile -t images < <(find pi-gen/deploy -maxdepth 1 -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          xz --test "$image"
          sudo install -m 0644 dist/photobox-provision.pyz pi-gen/deploy/
          (cd pi-gen/deploy && sha256sum "$(basename "$image")" photobox-provision.pyz | sudo tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: photobox-image-build
          path: pi-gen/deploy/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: photobox-setup-windows-x64
            file: photobox-setup-windows-x64.exe
          - runner: ubuntu-22.04
            name: photobox-setup-linux-x64
            file: photobox-setup-linux-x64
          - runner: macos-15
            name: photobox-setup-macos-arm64
            file: photobox-setup-macos-arm64
          - runner: macos-15-intel
            name: photobox-setup-macos-x64
            file: photobox-setup-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build standalone executable
        shell: bash
        run: |
          python -m pip install 'pyinstaller>=6,<7' 'qrcode>=8,<9'
          python -m PyInstaller --onefile --name '${{ matrix.name }}' --paths src \
            --copy-metadata qrcode --distpath standalone tools/provisioner_entry.py
          python tools/smoke_provisioner.py 'standalone/${{ matrix.file }}'
      - uses: actions/upload-artifact@v4
        with:
          name: provisioner-${{ matrix.name }}
          path: standalone/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [build, executables]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photobox-image-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: provisioner-*
          path: dist
          merge-multiple: true
      - name: Verify and checksum release files
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum *.img.xz *.pyz photobox-setup-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
