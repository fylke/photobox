name: Build Raspberry Pi image

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-image.yml"
      - "image/**"
      - "pyproject.toml"
      - "src/**"
      - "tools/**"
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Photobox wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - uses: actions/checkout@v4
        with:
          repository: RPi-Distro/pi-gen
          ref: c851f00178c64b87a86c06c2be216bd89d62e55b
          path: pi-gen

      - name: Prepare minimal image build
        run: |
          mkdir -p pi-gen/photobox/00-photobox/files
          cp image/photobox-stage/EXPORT_IMAGE pi-gen/photobox/EXPORT_IMAGE
          cp image/photobox-stage/prerun.sh pi-gen/photobox/prerun.sh
          chmod +x pi-gen/photobox/prerun.sh
          cp image/photobox-stage/00-photobox/00-packages-nr \
            image/photobox-stage/00-photobox/00-run-chroot.sh \
            pi-gen/photobox/00-photobox/
          cp image/photobox-stage/00-photobox/00-run.sh \
            pi-gen/photobox/00-photobox/00-run.sh
          chmod +x pi-gen/photobox/00-photobox/00-run.sh
          cp image/photobox-stage/00-photobox/files/photobox.service \
            image/photobox-stage/00-photobox/files/photobox-first-boot.service \
            image/photobox-stage/00-photobox/files/photobox-regulatory-domain.service \
            image/photobox-stage/00-photobox/files/50-photobox-network.rules \
            pi-gen/photobox/00-photobox/files/
          cp dist/photobox-*.whl pi-gen/photobox/00-photobox/files/
          cat > pi-gen/photobox-config <<'EOF'
          IMG_NAME='photobox'
          TARGET_HOSTNAME='photobox'
          RELEASE='trixie'
          ARCH='arm64'
          STAGE_LIST='stage0 stage1 photobox'
          DEPLOY_COMPRESSION='xz'
          ENABLE_SSH=0
          ENABLE_CLOUD_INIT=0
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            arch-test bc bmap-tools coreutils curl debootstrap dosfstools \
            e2fsprogs file gpg grep kmod libcap2-bin parted pigz quilt \
            qemu-user-binfmt rsync xxd xz-utils zerofree zip

      - name: Build minimal generic Raspberry Pi OS image
        working-directory: pi-gen
        run: sudo ./build.sh -c photobox-config

      - name: Verify and checksum generic image
        run: |
          set -euo pipefail
          mapfile -t images < <(find pi-gen/deploy -maxdepth 1 -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          xz --test "$image"
          (cd pi-gen/deploy && sha256sum "$(basename "$image")" | sudo tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: photobox-image-build
          path: pi-gen/deploy/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photobox-image-build
          path: dist
      - name: Verify and checksum release files
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum *.img.xz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: photobox-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist
      - name: Verify image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
          xz --test "${images[0]}"
      - name: Publish hardware-testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.img.xz dist/SHA256SUMS \
            --title "Photobox ${GITHUB_REF_NAME}" \
            --notes "Pre-release for controlled hardware testing only. CI image build succeeded, but physical Pi, camera, network, and two-phone validation remain outstanding. Use a disposable SD card and isolated network. See docs/hardware-validation-m2.md." \
            --prerelease
      - name: Generate Imager catalogue
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          python3 tools/build_imager_catalog.py "${images[0]}" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" public/imager.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
