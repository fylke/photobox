name: Clean up old release images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: photobox-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Remove old release image assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/cleanup_release_images.py
