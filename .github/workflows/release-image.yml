name: Publish Photobox image prerelease

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist

      - name: Verify image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
          xz --test "${images[0]}"

      - name: Publish hardware-testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.img.xz dist/SHA256SUMS \
            --title "Photobox ${GITHUB_REF_NAME}" \
            --notes "Pre-release for controlled hardware testing only. CI image build succeeded, but physical Pi, camera, network, and two-phone validation remain outstanding. Use a disposable SD card and isolated network. See docs/hardware-validation-m2.md." \
            --prerelease

  catalogue:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: photobox-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist
      - name: Generate Imager catalogue
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
          python3 tools/build_imager_catalog.py "${images[0]}" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" public/imager.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4