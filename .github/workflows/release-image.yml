name: Publish Photobox image prerelease

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photobox-raspios-arm64
          path: dist

      - name: Verify image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.img.xz' -print)
          test "${#images[@]}" -eq 1
          mapfile -t provisioners < <(find dist -maxdepth 1 -type f -name '*.pyz' -print)
          test "${#provisioners[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
          xz --test "${images[0]}"

      - name: Publish hardware-testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.img.xz dist/*.pyz dist/SHA256SUMS \
            --title "Photobox ${GITHUB_REF_NAME}" \
            --notes "Pre-release for controlled hardware testing only. CI image build succeeded, but physical Pi, camera, network, and two-phone validation remain outstanding. Use a disposable SD card and isolated network. See docs/hardware-validation-m2.md." \
            --prerelease