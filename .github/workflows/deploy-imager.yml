name: Deploy Web Imager

on:
  push:
    branches: [main]
    paths: ['docs/imager/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build imager
        run: |
          cd docs/imager
          npm install
          npm run build

      - name: Deploy to docs folder
        run: |
          # Create imager directory in docs
          mkdir -p docs/imager
          
          # Remove old built files
          rm -rf docs/imager/index.html docs/imager/assets 2>/dev/null || true
          
          # Copy new build (dist already has correct paths due to vite base config)
          cp -r docs/imager/dist/* docs/imager/
          
          # Show what was deployed
          echo "Deployed files:"
          ls -la docs/imager/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "chore: auto-deploy web imager [skip ci]" && git push)
