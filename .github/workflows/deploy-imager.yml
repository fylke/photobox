name: Deploy Web Imager

on:
  push:
    branches: [main]
    paths: ['docs/imager/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build imager
        run: |
          cd docs/imager
          npm install
          npm run build

      - name: Deploy to docs folder
        run: |
          # Clean old imager files
          rm -rf docs/assets docs/index.html 2>/dev/null || true
          rm -rf docs/*.js docs/*.css 2>/dev/null || true
          
          # Copy new build
          cp -r docs/imager/dist/* docs/
          
          # Show what was deployed
          echo "Deployed files:"
          ls -la docs/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "chore: auto-deploy web imager [skip ci]" && git push)
