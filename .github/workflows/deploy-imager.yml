name: Deploy Web Imager

on:
  push:
    branches: [main]
    paths: ['docs/imager/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build imager
        run: |
          cd docs/imager
          npm install
          
          # Create the template index.html that vite will process
          cat > index.html << 'EOF'
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobox Imager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
EOF
          
          npm run build

      - name: Deploy to docs folder
        run: |
          # Create imager directory in docs
          mkdir -p docs/imager
          
          # Remove old built assets and index
          rm -rf docs/imager/assets docs/imager/index.html 2>/dev/null || true
          
          # Copy built index.html and assets
          cp docs/imager/dist/index.html docs/imager/
          cp -r docs/imager/dist/assets docs/imager/
          
          # Show what was deployed
          echo "Deployed files:"
          ls -la docs/imager/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "chore: auto-deploy web imager [skip ci]" && git push)
